<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V-Bucks Şakası</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .top-right {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 14px;
            color: #ffcc00;
        }

        .container {
            background-color: #ffcc00;
            color: #000000;
            width: 400px;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.5);
            position: relative;
        }

        h2 {
            margin-top: 0;
            font-size: 20px;
            color: #000000;
        }

        .input-group {
            margin: 15px 0;
            text-align: left;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 2px solid #000000;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            background-color: #ffffff;
        }

        .btn {
            background-color: #000000;
            color: #ffcc00;
            border: none;
            padding: 12px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
        }

        .btn:hover {
            background-color: #333333;
        }

        .footer-text {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-size: 14px;
            color: #888888;
            left: 0;
        }

        .spinner {
            display: none;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #000000;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #message {
            display: none;
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
            color: #008000;
        }
    </style>
</head>
<body>

    <div class="top-right">Epic Games hesabınıza giriş yapın</div>

    <div class="container" id="main-box">
        <h2>V-Bucks Yükleme Paneli</h2>
        
        <div id="form-content">
            <div class="input-group">
                <label>@ Adresi</label>
                <input type="text" placeholder="eposta@ornek.com">
            </div>

            <div class="input-group">
                <label>Şifre Gir</label>
                <input type="password" placeholder="Şifreniz">
            </div>

            <div class="input-group">
                <label>V-Bucks Bakiyesini Seçin</label>
                <select>
                    <option value="500">500 V-Bucks</option>
                    <option value="1000">1000 V-Bucks</option>
                    <option value="2000">2000 V-Bucks</option>
                    <option value="5000">5000 V-Bucks</option>
                </select>
            </div>

            <button class="btn" onclick="startJoke()">Onayla</button>
        </div>

        <div class="spinner" id="loadingSpinner"></div>
        <div id="message"></div>
    </div>

    <div class="footer-text">Herkesin V-Bucks almaya hakkı vardır</div>

    <script>
        function startJoke() {
            document.getElementById('form-content').style.display = 'none';
            document.getElementById('loadingSpinner').style.display = 'block';

            setTimeout(function() {
                document.getElementById('loadingSpinner').style.display = 'none';
                const msg = document.getElementById('message');
                msg.style.display = 'block';
                msg.innerText = 'Şaka maka V-Buck yatırıldı! :)';
            }, 3000);
        }
    </script>

</body>
    </html>
